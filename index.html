<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Havneapp</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #021D48;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    .logo { width: 96px; height: 96px; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { opacity: 0.85; line-height: 1.5; margin-bottom: 32px; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .stores a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 12px;
      background: #ffffff;
      color: #021D48;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Havneapp" />
    <h1>Havneapp</h1>
    <p>Betal for din gæsteplads nemt fra din telefon. Scan QR-koden ved din havn for at komme i gang, eller hent appen herunder.</p>
    <div class="stores">
      <!-- TODO: erstat med de rigtige App Store / Play Store-links, når appen er udgivet -->
      <a href="#">Hent på App Store</a>
      <a href="#">Hent på Google Play</a>
    </div>
  </div>
</body>
</html>
