<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Havneapp – Betaling</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #021D48;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 420px; width: 100%; text-align: center; }
    h1 { font-size: 1.2rem; margin: 16px 0 24px 0; font-weight: 600; }
    p { opacity: 0.85; line-height: 1.5; font-size: 0.95rem; }
    #wallets { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    #wallets:empty { margin-bottom: 0; }
    /* apple-pay-button er et custom element der ignorerer almindelig
       inline width/height — størrelse styres via Apples egne
       CSS-variabler i stedet. */
    apple-pay-button {
      display: block;
      width: 100%;
      --apple-pay-button-width: 100%;
      --apple-pay-button-height: 45px;
      --apple-pay-button-border-radius: 4px;
      --apple-pay-button-padding: 0px;
      --apple-pay-button-box-sizing: border-box;
    }
    #buttons { margin-top: 6px; min-height: 45px; }
    .spinner {
      width: 32px; height: 32px; margin: 40px auto;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .error { color: #ffb4b4; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">Vælg betalingsmetode</h1>
    <div id="loading" class="spinner"></div>
    <div id="wallets"></div>
    <div id="buttons" class="hidden"></div>
    <p id="statusText" class="hidden"></p>
  </div>

  <script>
    const STRINGS = {
      da: {
        heading: 'Vælg betalingsmetode',
        loadFailed: 'Kunne ikke indlæse betalingsmuligheder. Prøv igen.',
        processing: 'Bekræfter betaling …',
        cancelled: 'Betalingen blev annulleret.',
        failed: 'Betalingen kunne ikke gennemføres.',
      },
      en: {
        heading: 'Choose a payment method',
        loadFailed: 'Could not load payment options. Please try again.',
        processing: 'Confirming payment …',
        cancelled: 'Payment was cancelled.',
        failed: 'Payment could not be completed.',
      },
      de: {
        heading: 'Zahlungsmethode wählen',
        loadFailed: 'Zahlungsoptionen konnten nicht geladen werden. Bitte versuche es erneut.',
        processing: 'Zahlung wird bestätigt …',
        cancelled: 'Die Zahlung wurde abgebrochen.',
        failed: 'Die Zahlung konnte nicht abgeschlossen werden.',
      },
    };

    const params = new URLSearchParams(window.location.search);
    const orderGroupId = params.get('orderGroupId');
    const harborId = params.get('harborId');
    const locale = STRINGS[params.get('locale')] ? params.get('locale') : 'da';
    const t = STRINGS[locale];

    const SUPABASE_URL = 'https://aztvblebdwlufpgalwgp.supabase.co';
    const ANON_KEY = 'sb_publishable_jWJfNGV5U-WOnob2pSbjow_BqM2SS7g';

    const headingEl = document.getElementById('heading');
    const loadingEl = document.getElementById('loading');
    const walletsEl = document.getElementById('wallets');
    const buttonsEl = document.getElementById('buttons');
    const statusEl = document.getElementById('statusText');

    headingEl.textContent = t.heading;

    // Én oprettet PayPal-ordre genbruges på tværs af de tre betalingsveje
    // (PayPal-knap, Google Pay, Apple Pay) — hver vej opretter sin egen
    // ordre i det øjeblik brugeren klikker, så en påbegyndt men aldrig
    // gennemført ordre ikke efterlader dobbelte rækker.

    function notifyFlutter(payload) {
      const message = JSON.stringify(payload);
      if (window.FlutterBridge && window.FlutterBridge.postMessage) {
        window.FlutterBridge.postMessage(message);
      } else {
        console.log('FlutterBridge:', message);
      }
    }

    function showError(text) {
      loadingEl.classList.add('hidden');
      statusEl.textContent = text;
      statusEl.classList.remove('hidden');
      statusEl.classList.add('error');
    }

    function showStatus(text) {
      statusEl.classList.remove('error');
      statusEl.textContent = text;
      statusEl.classList.remove('hidden');
    }

    async function callFunction(name, body) {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
        method: 'POST',
        headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Ukendt fejl');
      return data;
    }

    async function createOrder() {
      return callFunction('paypal-create-order', { orderGroupId });
    }

    async function captureOrder(orderId) {
      return callFunction('paypal-capture-order', { orderId, orderGroupId });
    }

    let paypalClientId = null;
    let paypalEnv = 'sandbox';
    // Google Pay/Apple Pay's egne biblioteker og PayPal's SDK indlæses
    // parallelt i vilkårlig rækkefølge — et promise (i stedet for et
    // fire-once event) sikrer at deres opsætning virker uanset hvilken
    // der bliver klar først.
    let resolveSdkReady;
    const sdkReady = new Promise((resolve) => {
      resolveSdkReady = resolve;
    });

    async function init() {
      if (!orderGroupId || !harborId) {
        showError(t.loadFailed);
        return;
      }
      try {
        const config = await fetch(
          `${SUPABASE_URL}/functions/v1/paypal-client-config?harborId=${encodeURIComponent(harborId)}`,
          { headers: { apikey: ANON_KEY } },
        ).then((r) => r.json());
        if (config.error) throw new Error(config.error);
        paypalClientId = config.clientId;
        paypalEnv = config.env;

        const script = document.createElement('script');
        script.src =
          `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(paypalClientId)}` +
          `&currency=DKK&intent=capture&components=buttons,googlepay,applepay`;
        script.onload = onSdkLoaded;
        script.onerror = () => showError(t.loadFailed);
        document.head.appendChild(script);

        // Google Pay og Apple Pays egne JS-biblioteker indlæses parallelt —
        // deres knapper vises kun hvis enheden/browseren rent faktisk
        // understøtter dem.
        loadScript('https://pay.google.com/gp/p/js/pay.js', setUpGooglePay);
        loadScript('https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js', setUpApplePay);
      } catch (e) {
        showError(t.loadFailed);
      }
    }

    function loadScript(src, onload) {
      const s = document.createElement('script');
      s.src = src;
      s.onload = onload;
      s.onerror = () => {}; // stille fejl — wallet'en vises bare ikke
      document.head.appendChild(s);
    }

    function onSdkLoaded() {
      loadingEl.classList.add('hidden');
      buttonsEl.classList.remove('hidden');

      paypal
        .Buttons({
          style: { height: 45 },
          createOrder: async () => {
            const data = await createOrder();
            return data.orderId;
          },
          onApprove: async (data) => {
            showStatus(t.processing);
            await finish(data.orderID);
          },
          onCancel: () => notifyFlutter({ status: 'cancelled' }),
          onError: (err) => {
            showError(t.failed);
            notifyFlutter({ status: 'error', message: String(err) });
          },
        })
        .render('#buttons');

      resolveSdkReady();
    }

    async function finish(orderId) {
      try {
        const result = await captureOrder(orderId);
        if (result.status === 'COMPLETED') {
          notifyFlutter({ status: 'success', orderId });
        } else {
          showError(t.failed);
          notifyFlutter({ status: 'error', message: t.failed });
        }
      } catch (e) {
        showError(t.failed);
        notifyFlutter({ status: 'error', message: String(e) });
      }
    }

    // ---------- Google Pay ----------

    function setUpGooglePay() {
      sdkReady.then(async () => {
        if (!window.paypal || !paypal.Googlepay) return;
        try {
          const googlepayConfig = await paypal.Googlepay().config();
          const paymentsClient = new google.payments.api.PaymentsClient({
            environment: paypalEnv === 'live' ? 'PRODUCTION' : 'TEST',
          });
          const isReadyToPayRequest = {
            apiVersion: 2,
            apiVersionMinor: 0,
            allowedPaymentMethods: googlepayConfig.allowedPaymentMethods,
          };
          const response = await paymentsClient.isReadyToPay(isReadyToPayRequest);
          if (!response.result) return;

          const button = paymentsClient.createButton({
            buttonColor: 'white',
            buttonType: 'pay',
            buttonSizeMode: 'fill',
            onClick: async () => {
              try {
                const orderData = await createOrder();
                const paymentDataRequest = {
                  apiVersion: 2,
                  apiVersionMinor: 0,
                  allowedPaymentMethods: googlepayConfig.allowedPaymentMethods,
                  merchantInfo: googlepayConfig.merchantInfo,
                  transactionInfo: {
                    currencyCode: orderData.currency,
                    totalPriceStatus: 'FINAL',
                    totalPrice: String(orderData.amount),
                  },
                };
                const paymentData = await paymentsClient.loadPaymentData(paymentDataRequest);
                showStatus(t.processing);
                const confirmResult = await paypal.Googlepay().confirmOrder({
                  orderId: orderData.orderId,
                  paymentMethodData: paymentData.paymentMethodData,
                });
                if (confirmResult.status === 'APPROVED') {
                  await finish(orderData.orderId);
                } else {
                  showError(t.failed);
                  notifyFlutter({ status: 'error', message: t.failed });
                }
              } catch (e) {
                // Brugeren lukkede bare Google Pay-arket — ikke en fejl.
                if (e && e.statusCode === 'CANCELED') return;
                showError(t.failed);
                notifyFlutter({ status: 'error', message: String(e) });
              }
            },
          });
          button.style.width = '100%';
          button.style.height = '45px';
          walletsEl.appendChild(button);
        } catch (e) {
          // Google Pay er bare ikke eligibelt her — ingen fejlvisning.
        }
      });
    }

    // ---------- Apple Pay ----------

    function setUpApplePay() {
      sdkReady.then(async () => {
        if (!window.paypal || !paypal.Applepay) return;
        if (!window.ApplePaySession || !ApplePaySession.canMakePayments()) return;
        try {
          const applepay = paypal.Applepay();
          const applepayConfig = await applepay.config();
          if (!applepayConfig.isEligible) return;

          const container = document.createElement('div');
          // "pay" + locale "en" giver "Pay with  Pay" — matcher at
          // Google Pay-knappen heller ikke oversættes til sidens sprog.
          container.innerHTML =
            '<apple-pay-button id="btn-applepay" buttonstyle="black" type="pay" locale="en">';
          walletsEl.appendChild(container);

          document.getElementById('btn-applepay').addEventListener('click', async () => {
            try {
              const orderData = await createOrder();
              const paymentRequest = {
                countryCode: applepayConfig.countryCode,
                merchantCapabilities: applepayConfig.merchantCapabilities,
                supportedNetworks: applepayConfig.supportedNetworks,
                currencyCode: orderData.currency,
                total: {
                  label: 'Havneapp',
                  type: 'final',
                  amount: String(orderData.amount),
                },
              };
              const session = new ApplePaySession(4, paymentRequest);

              session.onvalidatemerchant = (event) => {
                applepay
                  .validateMerchant({ validationUrl: event.validationURL })
                  .then((result) => session.completeMerchantValidation(result.merchantSession))
                  .catch(() => session.abort());
              };

              session.onpaymentauthorized = async (event) => {
                try {
                  const confirmResult = await applepay.confirmOrder({
                    orderId: orderData.orderId,
                    token: event.payment.token,
                    billingContact: event.payment.billingContact,
                  });
                  if (confirmResult.status === 'APPROVED') {
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    showStatus(t.processing);
                    await finish(orderData.orderId);
                  } else {
                    session.completePayment(ApplePaySession.STATUS_FAILURE);
                    showError(t.failed);
                    notifyFlutter({ status: 'error', message: t.failed });
                  }
                } catch (e) {
                  session.completePayment(ApplePaySession.STATUS_FAILURE);
                  showError(t.failed);
                  notifyFlutter({ status: 'error', message: String(e) });
                }
              };

              session.begin();
            } catch (e) {
              showError(t.failed);
              notifyFlutter({ status: 'error', message: String(e) });
            }
          });
        } catch (e) {
          // Apple Pay er bare ikke eligibelt her — ingen fejlvisning.
        }
      });
    }

    init();
  </script>
</body>
</html>
